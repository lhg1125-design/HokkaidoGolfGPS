name: Build APK + Preview

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Prepare sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Keep legacy v0.7 compiling until it is removed in a later cleanup sprint.
          legacy = Path('app/src/main/java/com/hokkaidogolf/trip/FieldGpsActivity.java')
          s = legacy.read_text()
          s = s.replace('c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r,p));', 'c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r),p);')
          s = s.replace('c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r));', 'c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r),p);')
          legacy.write_text(s)

          # V0.8.1 polish: title stays Japanese, all content cards use rounded Korean text.
          path = Path('app/src/main/java/com/hokkaidogolf/trip/FieldGpsV08Activity.java')
          s = path.read_text()
          old = 'p.setColor(ac[i]);c.drawCircle(m+28,y+30,11,p);text(c,"DAY "+(i+1),m+50,y+35,9,GREEN,true);text(c,jp[i],m+22,y+70,18,INK,true);text(c,ko[i],m+22,y+94,10,Color.GRAY,false);'
          new = 'p.setColor(ac[i]);c.drawCircle(m+28,y+30,11,p);text(c,"DAY "+(i+1),m+50,y+35,9,GREEN,true);text(c,ko[i],m+22,y+72,17,INK,true);text(c,"홋카이도 라운드 · "+variantNames[i][0],m+22,y+98,9,Color.GRAY,false);'
          if old not in s:
              raise SystemExit('home card source pattern not found')
          s = s.replace(old, new)

          # Preview-only synthetic location so screenshots show the distance/GPS state clearly.
          old = 'if(previewMode){ selected=0; variant=0; }'
          new = 'if(previewMode){ selected=0; variant=0; Location demo=new Location("preview"); demo.setLatitude(43.2570513); demo.setLongitude(143.2283621); demo.setAccuracy(5f); location=demo; }'
          if old not in s:
              raise SystemExit('preview constructor source pattern not found')
          s = s.replace(old, new)
          s = s.replace('"V0.8 · FIELD READY LITE"', '"V0.8.1 · FIELD READY LITE"')
          s = s.replace('"V0.8 · GPS 실거리 / Front·Back은 Center ±12m 추정 · 지도 터치는 공략거리 추정"', '"V0.8.1 · GPS 실거리 / Front·Back은 Center ±12m 추정 · 지도 터치는 공략거리 추정"')
          path.write_text(s)
          PY

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HokkaidoGolfGPS-v0.8.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HokkaidoGolfGPS-v0.8.1-debug-apk
          path: HokkaidoGolfGPS-v0.8.1-debug.apk
          retention-days: 14

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Android preview screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash .github/scripts/capture-preview.sh

      - name: Upload Preview Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: HokkaidoGolfGPS-v0.8.1-preview-screenshots
          path: preview/*.png
          if-no-files-found: error
          retention-days: 14
