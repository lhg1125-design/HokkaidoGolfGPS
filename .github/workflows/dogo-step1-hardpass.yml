name: Dogo Step1 Hard Pass

on:
  push:
    branches: [ dogo-step1-hardpass ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardpass:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate Dogo official 18-hole dataset
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('app/src/main/assets/courses/dogo_cc_v1.json')
          d=json.loads(p.read_text())
          hs=d['holes']
          assert len(hs)==18
          assert [h['hole'] for h in hs]==list(range(1,19))
          assert all(h['course']=='OUT' for h in hs[:9])
          assert all(h['course']=='IN' for h in hs[9:])
          assert sum(h['par'] for h in hs)==72
          assert sum(h['regularM'] for h in hs[:9])==3139
          assert sum(h['regularM'] for h in hs[9:])==3083
          assert sum(h['regularM'] for h in hs)==6222
          assert d['distancePolicy']['beforeFieldCalibration']['front'] is None
          assert d['distancePolicy']['beforeFieldCalibration']['back'] is None
          assert d['distancePolicy']['forbidSyntheticFrontBack'] is True
          for i,h in enumerate(hs,1):
              assert h['mapAsset']==f'dogo-h{i:02d}-MASTER-LOCK-CLEAN.png'
          print('DOGO DATA HARD PASS: 18H / PAR72 / 6222m / asset 1:1')
          PY

      - name: Isolate known pre-existing FieldGpsActivity drawOval typo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/hokkaidogolf/trip/FieldGpsActivity.java')
          s=p.read_text()
          bad='c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r,p));'
          good='c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r),p);'
          assert bad in s, 'baseline typo signature changed'
          p.write_text(s.replace(bad,good,1))
          print('baseline drawOval compile typo isolated; repository source left unchanged')
          PY

      - name: Compile current branch without legacy patch chain
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Step1 APK
        uses: actions/upload-artifact@v4
        with:
          name: Dogo-Step1-HardPass-debug
          path: app/build/outputs/apk/debug/app-debug.apk
