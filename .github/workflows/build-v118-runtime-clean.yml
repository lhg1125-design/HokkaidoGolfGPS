name: Build V1.17.2 Fixed Home + Hokkaido Assets APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  runtime-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install image verifier
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Restore fixed V1.17 Home asset
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          parts = sorted(Path('.github/asset-lock').glob('v117_home_lock.hex.*'))
          assert len(parts) == 8, f'expected 8 lock chunks, got {len(parts)}'
          hexdata = ''.join(p.read_text().strip() for p in parts)
          out = Path('app/src/main/res/drawable-nodpi/v117_home_lock.webp')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_bytes(bytes.fromhex(hexdata))
          with Image.open(out) as im:
              assert im.width >= 200 and im.height >= 400, im.size
              print('LOCK HOME', im.size)
          print('LOCK HOME bytes', out.stat().st_size)
          PY

      - name: Verify V1.17 locked Home flow
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable-nodpi/v117_home_lock.webp
          grep -Fq 'v117_home_lock' app/src/main/java/com/hokkaidogolf/trip/V117HomeActivity.java
          grep -Fq 'finish();' app/src/main/java/com/hokkaidogolf/trip/CourseSelectActivity.java
          ! grep -Fq 'new Intent(this, FieldGpsV09Activity.class)' app/src/main/java/com/hokkaidogolf/trip/CourseSelectActivity.java
          grep -Fq 'android:screenOrientation="portrait"' app/src/main/AndroidManifest.xml
          echo 'V1.17 HOME LOCK + RETURN FLOW PASS'

      - name: Verify Hokkaido course structure
        run: |
          set -euo pipefail
          INDEX=app/src/main/assets/courses/course_index.json
          test -f "$INDEX"
          grep -Fq '"id": "kamishihoro"' "$INDEX"
          grep -Fq '"id": "furano"' "$INDEX"
          grep -Fq '"id": "sahoro"' "$INDEX"
          ! grep -Fqi 'demo_001' "$INDEX"
          test -f app/src/main/java/com/hokkaidogolf/trip/FieldGpsV09Activity.java
          echo 'Hokkaido course structure PASS'

      - name: Fetch 90 Hokkaido yardage images
        run: bash .github/scripts/fetch-v1185-hokkaido-runtime-assets.sh

      - name: Gate source yardage package
        run: |
          set -euo pipefail
          RES=app/src/main/res/drawable-nodpi
          K=$(find "$RES" -maxdepth 1 -type f -name 'yardage_kamishihoro_*.jpg' | wc -l)
          F=$(find "$RES" -maxdepth 1 -type f -name 'yardage_furano_*.jpg' | wc -l)
          S=$(find "$RES" -maxdepth 1 -type f -name 'yardage_sahoro_*.png' | wc -l)
          echo "Kamishihoro=$K Furano=$F Sahoro=$S"
          test "$K" -eq 36
          test "$F" -eq 36
          test "$S" -eq 18
          test $((K+F+S)) -eq 90
          test "$(find "$RES" -maxdepth 1 -type f -name 'yardage_royallinks_*' | wc -l)" -eq 0

      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify packaged APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" > /tmp/apk-files.txt
          grep -F 'assets/courses/course_index.json' /tmp/apk-files.txt
          grep -F 'res/drawable-nodpi-v4/v117_home_lock.webp' /tmp/apk-files.txt || grep -F 'v117_home_lock' /tmp/apk-files.txt
          K=$(grep -Ec '(^|/)yardage_kamishihoro_.*\.jpg$' /tmp/apk-files.txt || true)
          F=$(grep -Ec '(^|/)yardage_furano_.*\.jpg$' /tmp/apk-files.txt || true)
          S=$(grep -Ec '(^|/)yardage_sahoro_.*\.png$' /tmp/apk-files.txt || true)
          echo "APK yardage: K=$K F=$F S=$S Total=$((K+F+S))"
          test "$K" -eq 36
          test "$F" -eq 36
          test "$S" -eq 18
          if grep -Ei 'yardage_royallinks_|demo_course' /tmp/apk-files.txt; then
            echo 'Legacy/demo contamination detected'
            exit 1
          fi
          stat -c 'APK bytes=%s' "$APK"
          echo 'V1.17.2 FIXED HOME APK PASS'

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HokkaidoGolfGPS-V1.17.2-FIXED-HOME-HOKKAIDO-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HokkaidoGolfGPS-V1.17.2-FIXED-HOME-HOKKAIDO-debug-apk
          path: HokkaidoGolfGPS-V1.17.2-FIXED-HOME-HOKKAIDO-debug.apk
          retention-days: 14

      - name: Publish direct APK download in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v1.17.2-fixed-home'
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" HokkaidoGolfGPS-V1.17.2-FIXED-HOME-HOKKAIDO-debug.apk \
            --title 'HokkaidoGolfGPS V1.17.2 Fixed Home' \
            --notes 'Portrait V1.17 fixed Home visual lock, course selection returns Home, Hokkaido-only 90 yardage source assets, RoyalLinks/demo excluded.'
