name: Build APK + Preview

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Prepare legacy sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          legacy=Path('app/src/main/java/com/hokkaidogolf/trip/FieldGpsActivity.java')
          if legacy.exists():
              s=legacy.read_text()
              s=s.replace('c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r,p));','c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r),p);')
              s=s.replace('c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r));','c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r),p);')
              legacy.write_text(s)
          PY

      - name: Restore approved concept artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cat .github/assets/v12/hero.part*.b64 | tr -d '\n\r ' | base64 -d > app/src/main/res/drawable-nodpi/concept_hero_exact.webp
          cat .github/assets/v12/course.part*.b64 | tr -d '\n\r ' | base64 -d > app/src/main/res/drawable-nodpi/concept_course_exact.webp
          file app/src/main/res/drawable-nodpi/concept_hero_exact.webp
          file app/src/main/res/drawable-nodpi/concept_course_exact.webp

      - name: Install artwork renderer and browser capture
        run: python3 -m pip install --disable-pip-version-check pillow selenium

      - name: Fetch render-only rounded fonts
        run: |
          curl -L --fail --retry 3 https://raw.githubusercontent.com/google/fonts/main/ofl/jua/Jua-Regular.ttf -o /tmp/Jua-Regular.ttf
          curl -L --fail --retry 3 https://raw.githubusercontent.com/google/fonts/main/ofl/mplusrounded1c/MPLUSRounded1c-ExtraBold.ttf -o /tmp/MPLUSRounded1c-ExtraBold.ttf
          test -s /tmp/Jua-Regular.ttf
          test -s /tmp/MPLUSRounded1c-ExtraBold.ttf

      - name: Fetch and gate JP KR full-hole imagery
        run: bash .github/scripts/fetch-v18-premium-course-art.sh

      - name: Preserve Sahoro maps as JPG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('app/src/main/res/drawable-nodpi')
          srcs=sorted(root.glob('yardage_sahoro_*.png'))
          if len(srcs)!=18:
              raise SystemExit(f'expected 18 Sahoro PNGs before conversion, got {len(srcs)}')
          for src in srcs:
              dst=src.with_suffix('.jpg')
              with Image.open(src) as im:
                  im.convert('RGB').save(dst,'JPEG',quality=96,subsampling=0,optimize=True)
              src.unlink()
          outs=sorted(root.glob('yardage_sahoro_*.jpg'))
          if len(outs)!=18:
              raise SystemExit(f'expected 18 Sahoro JPGs after conversion, got {len(outs)}')
          print('SAHORO JPG PRESERVED',len(outs))
          PY

      - name: Upload Sahoro discovery
        uses: actions/upload-artifact@v4
        with:
          name: sahoro-full-hole-discovery
          path: |
            .github/tmp/v18/sahoro-candidates.txt
            .github/tmp/v18/sahoro-gora.html
          if-no-files-found: warn
          retention-days: 3

      - name: Render V1.12.2 artwork UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/generate-v12-ui.py')
          s=p.read_text()
          lines=[]
          for line in s.splitlines():
              parts=line.split(';')
              parts=[seg.replace(',font(', ',font=font(') if 'd.text(' in seg else seg for seg in parts]
              lines.append(';'.join(parts))
          s='\n'.join(lines)+'\n'
          s=s.replace('라운드 시작  →','라운드 시작  >')
          s=s.replace('COURSES OFFLINE ✓','COURSES OFFLINE')
          s=s.replace('GPS READY ✓','GPS READY')
          s=s.replace('24~26 AUG · HOKKAIDO TRIP','24~26 AUG - HOKKAIDO TRIP')
          s=s.replace('GPS × 코스맵 × 스코어 관리','GPS + 코스맵 + 스코어 관리')
          s=s.replace('4명 함께 · 자동 합계','4명 함께 / 자동 합계')
          p.write_text(s)
          PY
          python3 .github/scripts/generate-v12-ui.py
          python3 .github/scripts/generate-v18-premium-art.py
          test "$(find app/src/main/res/drawable-nodpi -maxdepth 1 -name 'yardage_sahoro_*.jpg' | wc -l)" -eq 18

      - name: Apply app patches
        run: |
          python3 .github/scripts/patch-v10.py
          python3 .github/scripts/patch-v11.py
          python3 .github/scripts/patch-v12.py
          python3 .github/scripts/patch-v121.py
          python3 .github/scripts/patch-v122.py
          python3 .github/scripts/patch-v13.py
          python3 .github/scripts/patch-v14.py
          python3 .github/scripts/patch-v141.py
          python3 .github/scripts/patch-v142.py
          python3 .github/scripts/patch-v143.py
          python3 .github/scripts/patch-v149.py
          python3 .github/scripts/patch-v15.py
          python3 .github/scripts/patch-v151.py
          python3 .github/scripts/patch-v16.py
          python3 .github/scripts/patch-v161.py
          python3 .github/scripts/patch-v162.py
          python3 .github/scripts/patch-v163.py
          python3 .github/scripts/patch-v163fix.py
          python3 .github/scripts/patch-v163restore.py
          python3 .github/scripts/patch-v170.py
          python3 .github/scripts/patch-v170fix.py
          python3 .github/scripts/patch-v170preview.py
          python3 .github/scripts/patch-v180.py
          python3 .github/scripts/patch-v180badge.py
          python3 .github/scripts/patch-v181.py
          python3 .github/scripts/patch-v182.py
          python3 .github/scripts/patch-v183.py
          python3 .github/scripts/patch-v190.py
          python3 .github/scripts/patch-v1100.py
          python3 .github/scripts/patch-v1101.py
          python3 .github/scripts/patch-v1102.py
          python3 .github/scripts/patch-v1104.py
          python3 .github/scripts/patch-v1105.py
          python3 .github/scripts/patch-v1106.py
          python3 .github/scripts/patch-v1110.py
          python3 .github/scripts/patch-v1111.py
          python3 .github/scripts/patch-v1112.py
          python3 .github/scripts/patch-v1113.py
          python3 .github/scripts/patch-v1114.py
          python3 .github/scripts/patch-v1120.py
          python3 .github/scripts/patch-v1121.py
          python3 .github/scripts/patch-v1122.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Gate final APK 126 full-hole resources
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep 'yardage_' > /tmp/yardage-apk.txt
          SAHORO=$(grep -c 'yardage_sahoro_' /tmp/yardage-apk.txt || true)
          TOTAL=$(grep -c 'yardage_' /tmp/yardage-apk.txt || true)
          echo "FINAL APK SAHORO=$SAHORO TOTAL=$TOTAL"
          test "$SAHORO" -eq 18
          test "$TOTAL" -eq 126

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HokkaidoGolfGPS-v1.12.2-map-pin-focus-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HokkaidoGolfGPS-v1.12.2-map-pin-focus-debug-apk
          path: HokkaidoGolfGPS-v1.12.2-map-pin-focus-debug.apk
          retention-days: 14

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Android preview screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash .github/scripts/capture-preview-v110.sh

      - name: Upload Preview Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: HokkaidoGolfGPS-v1.12.2-map-pin-focus-preview-screenshots
          path: preview/*.png
          if-no-files-found: error
          retention-days: 14
