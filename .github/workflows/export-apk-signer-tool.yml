name: Export APK Signer Tool

on:
  push:
    branches: [ royallinks-static-image-qc ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Download official uber-apk-signer v1.3.0
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 -o uber-apk-signer-1.3.0.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar
          echo 'e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  uber-apk-signer-1.3.0.jar' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: uber-apk-signer-1.3.0-verified
          path: uber-apk-signer-1.3.0.jar
          if-no-files-found: error
          retention-days: 1
