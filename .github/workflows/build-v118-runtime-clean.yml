name: Build V1.18.1 Runtime Course Loader APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  runtime-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify course loader structure
        run: |
          test -f app/src/main/assets/courses/course_index.json
          echo 'Course loader index PASS'

      - name: Build Runtime APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          if unzip -l "$APK" | grep -Ei 'royallinks|concept|golden|preview'; then
            echo 'Legacy concept contamination detected'
            exit 1
          fi
          echo 'V1.18.1 Runtime PASS'

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HokkaidoGolfGPS-V1.18.1-runtime-course-loader-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HokkaidoGolfGPS-V1.18.1-runtime-course-loader-debug
          path: HokkaidoGolfGPS-V1.18.1-runtime-course-loader-debug.apk
          retention-days: 14
