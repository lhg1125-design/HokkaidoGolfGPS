name: Build V1.13.6 UI Tune Lite

on:
  push:
    branches: [ release/v1.13.6-ui-tune-lite ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-tune-lite-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix legacy mascot RectF compile typo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/hokkaidogolf/trip/FieldGpsActivity.java')
          s = p.read_text()
          bad = 'new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r,p)'
          good = 'new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r)'
          if bad not in s:
              raise SystemExit('expected mascot RectF typo not found')
          p.write_text(s.replace(bad, good, 1))
          print('fixed mascot RectF 5-arg typo')
          PY

      - name: Build UI tune lite APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HokkaidoGolfGPS-v1.13.6-ui-tune-lite-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HokkaidoGolfGPS-v1.13.6-ui-tune-lite-debug-apk
          path: HokkaidoGolfGPS-v1.13.6-ui-tune-lite-debug.apk
