name: Build V1.13.6 UI Tune Lite

on:
  push:
    branches: [ release/v1.13.6-ui-tune-lite ]
    paths-ignore:
      - 'build-status/**'
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui-tune-lite-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install image validation tools
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Verify approved Hokkaido launcher WebP
        id: icon
        shell: bash
        run: |
          icon=app/src/main/res/drawable-nodpi/ic_hokkaido_launcher.webp
          test -s "$icon"
          python3 - "$icon" <<'PY'
          from PIL import Image, ImageStat
          import sys
          p=sys.argv[1]
          with Image.open(p) as im:
              im.verify()
          with Image.open(p) as im:
              w,h=im.size
              assert w == h and w >= 256, im.size
              stat=ImageStat.Stat(im.convert('RGB').resize((32,32)))
              assert sum(stat.stddev) > 20, stat.stddev
              print('approved launcher WebP verified', im.size)
          PY
          sha=$(sha256sum "$icon" | awk '{print $1}')
          bytes=$(stat -c%s "$icon")
          echo "source_sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "source_bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "launcher source sha256=$sha bytes=$bytes"

      - name: Fetch 90 Hokkaido yardage assets
        run: bash .github/scripts/fetch-v1185-hokkaido-runtime-assets.sh

      - name: Verify yardage source asset count
        run: |
          count=$(find app/src/main/res/drawable-nodpi -maxdepth 1 -type f \( -name 'yardage_kamishihoro_*' -o -name 'yardage_furano_*' -o -name 'yardage_sahoro_*' \) | wc -l)
          echo "yardage source assets=$count"
          test "$count" -eq 90

      - name: Apply premium yardage renderer to V09 launcher
        run: |
          python3 .github/scripts/patch-v1136-lite-premium-yardage.py
          grep -q 'V1.13.6 LITE PREMIUM YARDAGE' app/src/main/java/com/hokkaidogolf/trip/FieldGpsV09Activity.java
          grep -q 'yardageAssetName' app/src/main/java/com/hokkaidogolf/trip/FieldGpsV09Activity.java

      - name: Fix legacy mascot RectF compile typo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/hokkaidogolf/trip/FieldGpsActivity.java')
          s = p.read_text()
          bad = 'c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r,p));'
          good = 'c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r),p);'
          if bad not in s:
              raise SystemExit('expected mascot drawOval typo not found')
          p.write_text(s.replace(bad, good, 1))
          print('fixed mascot drawOval RectF/paint call')
          PY

      - name: Build UI tune lite APK
        id: build
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon :app:assembleDebug 2>&1 | tee v1136-ui-tune-lite-build.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "Gradle exit code: $rc"
          exit 0

      - name: Inspect packaged resources
        id: inspect
        if: steps.build.outputs.rc == '0'
        shell: bash
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep -i 'yardage_' | tee v1136-ui-tune-lite-yardage-apk.txt || true
          yardage_count=$(grep -c -i 'yardage_' v1136-ui-tune-lite-yardage-apk.txt || true)
          unzip -l "$apk" | grep -i 'ic_hokkaido_launcher' | tee v1136-ui-tune-lite-icon-apk.txt || true
          icon_count=$(grep -c -i 'ic_hokkaido_launcher' v1136-ui-tune-lite-icon-apk.txt || true)
          bytes=$(stat -c%s "$apk")
          echo "yardage_count=$yardage_count" >> "$GITHUB_OUTPUT"
          echo "icon_count=$icon_count" >> "$GITHUB_OUTPUT"
          echo "apk_bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "APK yardage entries=$yardage_count launcher entries=$icon_count APK bytes=$bytes"
          test "$yardage_count" -eq 90
          test "$icon_count" -ge 1

      - name: Publish build result to branch
        shell: bash
        env:
          BUILD_RC: ${{ steps.build.outputs.rc }}
          YARDAGE_COUNT: ${{ steps.inspect.outputs.yardage_count }}
          ICON_COUNT: ${{ steps.inspect.outputs.icon_count }}
          APK_BYTES: ${{ steps.inspect.outputs.apk_bytes }}
          ICON_SHA256: ${{ steps.icon.outputs.source_sha256 }}
          ICON_BYTES: ${{ steps.icon.outputs.source_bytes }}
        run: |
          mkdir -p build-status dist
          {
            echo "workflow=Build V1.13.6 UI Tune Lite"
            echo "source_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "gradle_exit_code=${BUILD_RC}"
            echo "yardage_apk_entries=${YARDAGE_COUNT:-0}"
            echo "launcher_apk_entries=${ICON_COUNT:-0}"
            echo "launcher_source_sha256=${ICON_SHA256:-none}"
            echo "launcher_source_bytes=${ICON_BYTES:-0}"
            echo "apk_bytes=${APK_BYTES:-0}"
            if [ "${BUILD_RC}" = "0" ] && [ -f app/build/outputs/apk/debug/app-debug.apk ] && [ "${YARDAGE_COUNT:-0}" = "90" ] && [ "${ICON_COUNT:-0}" -ge 1 ]; then
              echo "result=SUCCESS"
              echo "apk=dist/HokkaidoGolfGPS-v1.13.6-ui-tune-lite-debug.apk"
            else
              echo "result=FAILED"
            fi
          } > build-status/v1136-ui-tune-lite.txt

          cp v1136-ui-tune-lite-build.log build-status/v1136-ui-tune-lite-build.log
          if [ -f v1136-ui-tune-lite-yardage-apk.txt ]; then
            cp v1136-ui-tune-lite-yardage-apk.txt build-status/v1136-ui-tune-lite-yardage-apk.txt
          fi
          if [ -f v1136-ui-tune-lite-icon-apk.txt ]; then
            cp v1136-ui-tune-lite-icon-apk.txt build-status/v1136-ui-tune-lite-icon-apk.txt
          fi
          if [ "${BUILD_RC}" = "0" ] && [ -f app/build/outputs/apk/debug/app-debug.apk ] && [ "${YARDAGE_COUNT:-0}" = "90" ] && [ "${ICON_COUNT:-0}" -ge 1 ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/HokkaidoGolfGPS-v1.13.6-ui-tune-lite-debug.apk
          else
            rm -f dist/HokkaidoGolfGPS-v1.13.6-ui-tune-lite-debug.apk
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-status/v1136-ui-tune-lite.txt build-status/v1136-ui-tune-lite-build.log
          if [ -f build-status/v1136-ui-tune-lite-yardage-apk.txt ]; then
            git add -f build-status/v1136-ui-tune-lite-yardage-apk.txt
          fi
          if [ -f build-status/v1136-ui-tune-lite-icon-apk.txt ]; then
            git add -f build-status/v1136-ui-tune-lite-icon-apk.txt
          fi
          if [ -f dist/HokkaidoGolfGPS-v1.13.6-ui-tune-lite-debug.apk ]; then
            git add -f dist/HokkaidoGolfGPS-v1.13.6-ui-tune-lite-debug.apk
          else
            git rm --ignore-unmatch dist/HokkaidoGolfGPS-v1.13.6-ui-tune-lite-debug.apk || true
          fi
          if git diff --cached --quiet; then
            echo "No build result changes to publish"
          else
            git commit -m "ci: publish V1.13.6 UI Tune Lite audited build result [skip ci]"
            git push origin HEAD:release/v1.13.6-ui-tune-lite
          fi

      - name: Upload APK artifact
        if: steps.build.outputs.rc == '0' && steps.inspect.outputs.yardage_count == '90' && steps.inspect.outputs.icon_count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: HokkaidoGolfGPS-v1.13.6-ui-tune-lite-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Fail workflow when build or packaging audit failed
        if: steps.build.outputs.rc != '0' || steps.inspect.outputs.yardage_count != '90' || steps.inspect.outputs.icon_count == '0'
        run: exit 1
