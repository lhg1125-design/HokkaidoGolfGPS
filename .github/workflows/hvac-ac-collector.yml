name: Build VWID AC Collector

on:
  push:
    branches: [ hvac-bridge-r5-build ]
    paths:
      - 'hvac-ac-collector/**'
      - '.github/workflows/hvac-ac-collector.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-collector:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify read-only scope
        run: python3 hvac-ac-collector/tests/check_readonly.py
      - name: Build APK
        working-directory: hvac-ac-collector
        run: gradle :app:assembleDebug --stacktrace
      - name: Package APK and source
        run: |
          cp hvac-ac-collector/app/build/outputs/apk/debug/app-debug.apk VWID_AC_COLLECTOR_1_0.apk
          git archive --format=zip --output=VWID_AC_COLLECTOR_1_0_SOURCE.zip HEAD hvac-ac-collector .github/workflows/hvac-ac-collector.yml
      - name: Upload collector
        uses: actions/upload-artifact@v4
        with:
          name: VWID_AC_COLLECTOR_1_0
          path: |
            VWID_AC_COLLECTOR_1_0.apk
            VWID_AC_COLLECTOR_1_0_SOURCE.zip
          if-no-files-found: error
