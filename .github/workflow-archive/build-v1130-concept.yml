name: Build V1.15.4 User Golden Visual QA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  concept-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install render tools
        run: python3 -m pip install --disable-pip-version-check pillow selenium requests numpy

      - name: Restore approved concept artwork
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cat .github/assets/v12/hero.part*.b64 | tr -d '\n\r ' | base64 -d > app/src/main/res/drawable-nodpi/concept_hero_exact.webp
          cat .github/assets/v12/course.part*.b64 | tr -d '\n\r ' | base64 -d > app/src/main/res/drawable-nodpi/concept_course_exact.webp

      - name: Bundle concept fonts
        run: |
          curl -L --fail --retry 3 https://raw.githubusercontent.com/google/fonts/main/ofl/jua/Jua-Regular.ttf -o /tmp/Jua-Regular.ttf
          curl -L --fail --retry 3 https://raw.githubusercontent.com/google/fonts/main/ofl/mplusrounded1c/MPLUSRounded1c-ExtraBold.ttf -o /tmp/MPLUSRounded1c-ExtraBold.ttf
          mkdir -p app/src/main/assets/fonts
          cp /tmp/Jua-Regular.ttf app/src/main/assets/fonts/Jua-Regular.ttf
          cp /tmp/MPLUSRounded1c-ExtraBold.ttf app/src/main/assets/fonts/MPLUSRounded1c-ExtraBold.ttf

      - name: Fetch full-hole imagery
        run: bash .github/scripts/fetch-v18-premium-course-art.sh

      - name: Preserve Sahoro as JPG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('app/src/main/res/drawable-nodpi')
          srcs=sorted(root.glob('yardage_sahoro_*.png'))
          if len(srcs)!=18: raise SystemExit(f'expected 18 Sahoro PNGs, got {len(srcs)}')
          for src in srcs:
              dst=src.with_suffix('.jpg')
              with Image.open(src) as im: im.convert('RGB').save(dst,'JPEG',quality=96,subsampling=0,optimize=True)
              src.unlink()
          PY

      - name: Fetch Naepo real yardage
        run: python3 .github/scripts/fetch-naepo-real-yardage-v1132.py

      - name: Prepare reviewed Furano V1.15.4 generator
        run: python3 .github/scripts/prepare-furano-v1154-reviewed.py

      - name: Generate H1-H3 bases from high-resolution official Furano sources
        run: python3 .github/scripts/generate-furano-king123-v1152.py

      - name: Preserve approved H2-H3 raw-source provenance
        run: python3 .github/scripts/lock-furano-king23-approved-v1152.py

      - name: Apply H1 approved Golden Master and freeze all three bases
        run: |
          python3 .github/scripts/apply-furano-h1-master-v1152.py
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/furano_king123_v1154.lock <<'EOF'
          FURANO KING H1-H3 USER GOLDEN VISUAL LOCK
          H1=approved 365x1062 master SHA e0a3e18b07a6b10f32ef04d9751afc3c300c1417bfac9955d585a5c2b9c12254
          H2=Prince official high-resolution base generated before 408_2 provenance lock
          H3=Prince official high-resolution base generated before 408_3 provenance lock
          H1_BOARD=393/412/430m
          H2_BOARD=142/154/166m
          H3_BOARD=355/367/379m
          RULER_TOP=250/250/400m
          RULE=no generic postprocess, no chrome redraw, no geometry regeneration after freeze
          EOF
          sha256sum \
            app/src/main/res/drawable-nodpi/furano_king_h1_base_v1152.webp \
            app/src/main/res/drawable-nodpi/furano_king_h2_base_v1152.webp \
            app/src/main/res/drawable-nodpi/furano_king_h3_base_v1152.webp > /tmp/furano-v1154-golden.sha256
          cat /tmp/furano-v1154-golden.sha256

      - name: Stylize 135 yardages without touching frozen Furano bases
        run: python3 .github/scripts/stylize-yardage-v1130.py

      - name: Render concept UI assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/generate-v12-ui.py'); s=p.read_text(); lines=[]
          for line in s.splitlines():
              parts=line.split(';'); parts=[seg.replace(',font(', ',font=font(') if 'd.text(' in seg else seg for seg in parts]; lines.append(';'.join(parts))
          s='\n'.join(lines)+'\n'
          s=s.replace('라운드 시작  →','라운드 시작  >').replace('COURSES OFFLINE ✓','COURSES OFFLINE').replace('GPS READY ✓','GPS READY')
          s=s.replace('24~26 AUG · HOKKAIDO TRIP','24~26 AUG - HOKKAIDO TRIP').replace('GPS × 코스맵 × 스코어 관리','GPS + 코스맵 + 스코어 관리').replace('4명 함께 · 자동 합계','4명 함께 / 자동 합계')
          p.write_text(s)
          PY
          python3 .github/scripts/generate-v12-ui.py
          python3 .github/scripts/generate-v18-premium-art.py

      - name: Apply patch chain through V1.15.4
        run: |
          set -e
          for p in patch-v10 patch-v11 patch-v12 patch-v121 patch-v122 patch-v13 patch-v14 patch-v141 patch-v142 patch-v143 patch-v149 patch-v15 patch-v151 patch-v16 patch-v161 patch-v162 patch-v163 patch-v163fix patch-v163restore patch-v170 patch-v170fix patch-v170preview patch-v180 patch-v180badge patch-v181 patch-v182 patch-v183 patch-v190 patch-v1100 patch-v1101 patch-v1102 patch-v1104 patch-v1105 patch-v1106 patch-v1110 patch-v1111 patch-v1112 patch-v1113 patch-v1114 patch-v1120 patch-v1121 patch-v1122 patch-v1123 patch-v1124 patch-v1130 patch-v1131-bootstrap patch-v1131 patch-v1132 patch-v1132simfix patch-v1133 patch-v1134 patch-v1135 patch-v1136 patch-v1137 patch-v1138; do
            python3 ".github/scripts/${p}.py"
          done
          python3 .github/scripts/storybook_v1151_polish.py
          python3 .github/scripts/storybook_v1152_furano123.py
          python3 .github/scripts/storybook_v1153_h1masterfix.py
          python3 .github/scripts/storybook_v1154_visual_lock.py

      - name: Verify Golden bases survived build preparation unchanged
        run: sha256sum -c /tmp/furano-v1154-golden.sha256

      - name: Set package version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/build.gradle.kts'); s=p.read_text()
          s=re.sub(r'versionCode\s*=\s*\d+','versionCode = 62',s,1)
          s=re.sub(r'versionName\s*=\s*"[^"]+"','versionName = "1.15.4-user-golden-visual-lock"',s,1)
          p.write_text(s)
          PY

      - name: Build V1.15.4 debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Gate V1.15.4 user-approved visual APK
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep 'yardage_' > /tmp/yardage-apk.txt
          grep -E 'yardage_(kamishihoro_|furano_|sahoro_|naepo_|royallinks_)' /tmp/yardage-apk.txt > /tmp/course-yardage-apk.txt
          test "$(wc -l < /tmp/course-yardage-apk.txt)" -eq 135
          test "$(grep -c 'yardage_naepo_' /tmp/course-yardage-apk.txt)" -eq 9
          grep -Fq 'V1.15.4 · USER GOLDEN VISUAL LOCK' app/src/main/java/com/hokkaidogolf/trip/FieldGpsV09Activity.java
          grep -Fq 'applyImmersiveV1154' app/src/main/java/com/hokkaidogolf/trip/FieldGpsV09Activity.java
          grep -Fq '{451,168,401,523,386,335,175,359,489,350,312,535,346,151,360,170,422,506}' app/src/main/java/com/hokkaidogolf/trip/FieldGpsV09Activity.java
          grep -Fq 'if(previewMode){if(hole==1)return 286;if(hole==2)return 154;return 367;}' app/src/main/java/com/hokkaidogolf/trip/FieldGpsV09Activity.java
          grep -Fq 'drawFuranoKing123V1152' app/src/main/java/com/hokkaidogolf/trip/FieldGpsV09Activity.java
          test -s app/src/main/assets/furano_king123_v1154.lock
          grep -Fq 'H1_BOARD=393/412/430m' app/src/main/assets/furano_king123_v1154.lock
          grep -Fq 'RULER_TOP=250/250/400m' app/src/main/assets/furano_king123_v1154.lock
          PATCH_BLOCK=$(awk '/- name: Apply patch chain through V1.15.4/{f=1} /- name: Verify Golden bases survived build preparation unchanged/{f=0} f' .github/workflows/build-v1130-concept.yml)
          if printf '%s\n' "$PATCH_BLOCK" | grep -Fq 'restore-furano-king123-chrome-v1153.py'; then echo 'legacy chrome redraw returned' >&2; exit 1; fi
          sha256sum -c /tmp/furano-v1154-golden.sha256
          cp "$APK" HokkaidoGolfGPS-v1.15.4-user-golden-visual-lock-debug.apk

      - name: Upload V1.15.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: HokkaidoGolfGPS-v1.15.4-user-golden-visual-lock-debug-apk
          path: HokkaidoGolfGPS-v1.15.4-user-golden-visual-lock-debug.apk
          retention-days: 14

      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm || true

      - name: Capture and inspect V1.15.4 Furano KING H1-H3
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash .github/scripts/capture-preview-v1152-furano123.sh

      - name: Upload V1.15.4 inspected Furano previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HokkaidoGolfGPS-v1.15.4-user-golden-visual-lock-preview-screenshots
          path: preview-v1154-furano123/*.png
          if-no-files-found: warn
          retention-days: 14
