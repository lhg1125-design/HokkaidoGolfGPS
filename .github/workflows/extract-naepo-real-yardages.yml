name: Extract Naepo Real Yardages
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/extract-naepo-real-yardages.yml'
      - '.github/data/naepo-round-224012917731-originals.txt'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: python3 -m pip install --disable-pip-version-check pillow requests
      - name: Download verified Naepo round-post originals
        run: |
          mkdir -p .github/tmp/naepo-real/originals
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          import requests
          from PIL import Image,ImageDraw,ImageFont
          from io import BytesIO
          root=Path('.github/tmp/naepo-real'); od=root/'originals'
          urls=[x.strip() for x in Path('.github/data/naepo-round-224012917731-originals.txt').read_text().splitlines() if x.strip()]
          ua={'User-Agent':'Mozilla/5.0 (Linux; Android 14; SM-S918N) AppleWebKit/537.36 Chrome/143.0.0.0 Mobile Safari/537.36','Referer':'https://m.blog.naver.com/jc_song/224012917731'}
          sess=requests.Session();sess.headers.update(ua);saved=[]
          for i,url in enumerate(urls):
            candidates=[url,'https://search.pstatic.net/common/?src='+quote(url,safe='')+'&type=sc960_832']
            data=None
            for u in candidates:
              try:
                r=sess.get(u,timeout=20);print('GET',i,r.status_code,len(r.content),u[:150])
                if r.status_code==200 and len(r.content)>5000:
                  try:im=Image.open(BytesIO(r.content)).convert('RGB');data=im;break
                  except:pass
              except Exception as e:print('ERR',i,e)
            if data is None:continue
            p=od/f'{i:02d}_{data.width}x{data.height}.jpg';data.save(p,'JPEG',quality=96,subsampling=0)
            saved.append((p,url,data.size))
          if len(saved)<9:raise SystemExit(f'only {len(saved)} originals downloaded')
          (root/'manifest.tsv').write_text('\n'.join(f'{p.name}\t{sz[0]}x{sz[1]}\t{url}' for p,url,sz in saved),encoding='utf-8')
          print('SAVED',len(saved))
          cols=3;tw=520;th=570;rows=(len(saved)+cols-1)//cols
          sheet=Image.new('RGB',(cols*tw,rows*th),'white');d=ImageDraw.Draw(sheet);font=ImageFont.load_default()
          for j,(p,url,sz) in enumerate(saved):
            im=Image.open(p).convert('RGB');im.thumbnail((tw-22,th-58),Image.Resampling.LANCZOS)
            x=(j%cols)*tw+(tw-im.width)//2;y=(j//cols)*th+8;sheet.paste(im,(x,y))
            d.rectangle(((j%cols)*tw+4,(j//cols)*th+4,(j%cols+1)*tw-4,(j//cols+1)*th-4),outline=(60,110,70),width=3)
            d.text(((j%cols)*tw+12,(j//cols)*th+th-40),f'{j:02d} {sz[0]}x{sz[1]}',fill=(20,60,30),font=font)
          sheet.save(root/'naepo-original-contact.jpg','JPEG',quality=95)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: naepo-real-yardage-originals
          path: .github/tmp/naepo-real/*
          if-no-files-found: error
          retention-days: 7
