name: Build APK + Preview

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Hotfix source typo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/hokkaidogolf/trip/FieldGpsActivity.java')
          s = path.read_text()
          bad1 = 'c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r,p));'
          bad2 = 'c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r));'
          good = 'c.drawOval(new RectF(x-r*.8f,y+r*.78f,x+r*.8f,y+r),p);'
          if bad1 in s:
              s = s.replace(bad1, good)
          elif bad2 in s:
              s = s.replace(bad2, good)
          else:
              raise SystemExit('expected drawOval typo not found')
          path.write_text(s)
          PY

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HokkaidoGolfGPS-v0.7-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HokkaidoGolfGPS-v0.7-debug-apk
          path: HokkaidoGolfGPS-v0.7-debug.apk
          retention-days: 14

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture Android preview screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash .github/scripts/capture-preview.sh

      - name: Upload Preview Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: HokkaidoGolfGPS-v0.7-preview-screenshots
          path: preview/*.png
          if-no-files-found: error
          retention-days: 14
