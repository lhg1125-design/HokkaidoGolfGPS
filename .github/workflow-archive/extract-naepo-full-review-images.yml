name: Extract Naepo Full Review Images
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/extract-naepo-full-review-images.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: python3 -m pip install --disable-pip-version-check selenium pillow requests
      - name: Extract all images from comprehensive Naepo reviews
        run: |
          mkdir -p .github/tmp/naepo-full-reviews
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urljoin,quote
          import re,time,html,requests
          from PIL import Image,ImageDraw,ImageFont
          from io import BytesIO
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          root=Path('.github/tmp/naepo-full-reviews')
          ua='Mozilla/5.0 (Linux; Android 14; SM-S918N) AppleWebKit/537.36 Chrome/143.0.0.0 Mobile Safari/537.36'
          reviews=[
            ('yura','https://m.blog.naver.com/yuraisjustyura/224020582783'),
            ('cdj','https://m.blog.naver.com/cdj1444/224019284519'),
            ('jinki','https://m.blog.naver.com/jinki32/224358693547'),
            ('song','https://m.blog.naver.com/jc_song/224012917731')]
          opt=Options()
          for a in ('--headless=new','--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--window-size=1440,2400'):opt.add_argument(a)
          opt.add_argument('--user-agent='+ua);d=webdriver.Chrome(options=opt)
          sess=requests.Session();sess.headers.update({'User-Agent':ua,'Referer':'https://m.blog.naver.com/'})
          try:
            for label,url in reviews:
              out=root/label;out.mkdir(exist_ok=True);print('ARTICLE',label,url)
              d.get(url);time.sleep(3)
              for _ in range(5):d.execute_script('window.scrollTo(0, document.body.scrollHeight);');time.sleep(.5)
              s=html.unescape(d.page_source);(out/'page.html').write_text(s,encoding='utf-8',errors='ignore')
              try:d.save_screenshot(str(out/'page.png'))
              except:pass
              urls=[]
              def add(u):
                if not u:return
                u=urljoin(d.current_url,u).replace('http://blogfiles.naver.net','https://blogfiles.naver.net')
                if u.startswith('http') and u not in urls:urls.append(u)
              for el in d.find_elements('css selector','img'):
                for at in ('src','data-src','data-lazy-src','data-original'):
                  try:add(el.get_attribute(at) or '')
                  except:pass
              for m in re.finditer(r'https?://[^\"\'<>\\ ]+(?:jpg|jpeg|png|webp)[^\"\'<>\\ ]*',s,re.I):add(m.group(0).replace('&amp;','&'))
              # Naver stores originals inside JSON-ish fields even if img src is resized.
              for pat in [r'"originalUrl":"([^"]+)"',r'"src":"(https?://blogfiles\.naver\.net[^"]+)"',r'"imageUrl":"([^"]+)"']:
                for m in re.finditer(pat,s):add(m.group(1).replace('\\/','/'))
              print('URLS',len(urls));saved=[]
              for i,u in enumerate(urls):
                if any(x in u.lower() for x in ['profile','icon','emoji','logo','banner']):continue
                candidates=[u]
                if 'blogfiles.naver.net' in u:candidates.insert(0,'https://search.pstatic.net/common/?src='+quote(u,safe='')+'&type=sc960_832')
                im=None
                for cu in candidates:
                  try:r=sess.get(cu,timeout=8)
                  except:continue
                  if r.status_code!=200 or len(r.content)<5000:continue
                  try:im=Image.open(BytesIO(r.content)).convert('RGB');break
                  except:pass
                if im is None or im.width<250 or im.height<200:continue
                p=out/f'{len(saved):03d}_{im.width}x{im.height}.jpg';im.save(p,'JPEG',quality=94,subsampling=0);saved.append((p,u,im.size))
                if len(saved)>=100:break
              print('SAVED',label,len(saved));(out/'manifest.tsv').write_text('\n'.join(f'{p.name}\t{sz[0]}x{sz[1]}\t{u}' for p,u,sz in saved),encoding='utf-8')
              cols=4;tw=300;th=350;font=ImageFont.load_default()
              for pg in range((len(saved)+19)//20):
                ss=saved[pg*20:(pg+1)*20];sheet=Image.new('RGB',(cols*tw,5*th),'white');dr=ImageDraw.Draw(sheet)
                for j,(p,u,sz) in enumerate(ss):
                  im=Image.open(p).convert('RGB');im.thumbnail((tw-12,th-48),Image.Resampling.LANCZOS);x=(j%cols)*tw+(tw-im.width)//2;y=(j//cols)*th+4;sheet.paste(im,(x,y));dr.text(((j%cols)*tw+6,(j//cols)*th+th-35),f'{pg*20+j:03d} {sz[0]}x{sz[1]}',fill='black',font=font)
                sheet.save(out/f'contact-{pg:02d}.jpg','JPEG',quality=92)
          finally:d.quit()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: naepo-full-review-image-sets
          path: .github/tmp/naepo-full-reviews/*
          if-no-files-found: error
          retention-days: 5
